[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "texlens"
dynamic = ["version"]
description = "Count the words of a LaTeX paper without its hidden text, and list its notes to coauthors and revised passages."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Roberta De Viti" }]
keywords = ["latex", "word count", "texcount", "academic writing", "revision"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.scripts]
texlens = "texlens.cli:main"

[tool.setuptools.dynamic]
version = { attr = "texlens.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
